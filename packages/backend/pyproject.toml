[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldops-backend"
version = "0.1.0"
description = "FieldOps Backend — FastAPI + SQLAlchemy + Celery"
requires-python = ">=3.12"
authors = [
    { name = "FieldOps Team" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "celery>=5.4.0",
    "kombu>=5.4.0",
    "redis>=5.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "black>=26.0.0",
    "isort>=5.13.0",
    "flake8>=7.3.0",
    "mypy>=2.0.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
strict = true
python_version = "3.12"
